<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Let's Go</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #10172a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 420px; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: #94a3b8; line-height: 1.5; }
      a {
        display: inline-block;
        margin-top: 16px;
        background: #08b981;
        color: #fff;
        padding: 12px 24px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg width="72" height="72" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <rect width="512" height="512" rx="112" fill="#08B981" />
        <path d="M148 336 L236 128 L276 128 L212 296 L316 296 L308 336 Z" fill="#fff" />
      </svg>
      <h1>You're offline</h1>
      <p>Let's Go needs a connection to load activities and messages. Your data is safe — try again in a moment.</p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
